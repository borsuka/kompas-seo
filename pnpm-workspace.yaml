packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks all others by default).
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  # Usage telemetry only — not needed.
  '@scarf/scarf': false
  '@parcel/watcher': true
  unrs-resolver: true
  # Native binaries come as optional dependencies; the postinstall is only a fallback.
  '@swc/core': false

minimumReleaseAgeExclude:
  - '@next/env@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - next@16.4.0
  - '@next/eslint-plugin-next@16.4.0'
  - eslint-config-next@16.4.0
