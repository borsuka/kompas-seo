name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: seo
          POSTGRES_PASSWORD: seo
          POSTGRES_DB: seo_test
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U seo -d seo_test" --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: seo
          CLICKHOUSE_PASSWORD: seo
          CLICKHOUSE_DB: seo
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports: ['18123:8123']
        options: >-
          --health-cmd "clickhouse-client --user seo --password seo --query 'SELECT 1'" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure environment
        run: cp .env.example .env
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: seo
          POSTGRES_PASSWORD: seo
          POSTGRES_DB: seo
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U seo -d seo" --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: seo
          CLICKHOUSE_PASSWORD: seo
          CLICKHOUSE_DB: seo
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports: ['18123:8123']
        options: >-
          --health-cmd "clickhouse-client --user seo --password seo --query 'SELECT 1'" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['16379:6379']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['11025:1025', '18025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure environment
        # Production mode refuses the example secrets, so generate fresh ones per run.
        run: |
          cp .env.example .env
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm --filter @seo/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          NODE_ENV: production
          LOG_LEVEL: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
